# Copy to <target-repo>/.github/workflows/ai-review.yml
name: ai-review

on:
  pull_request:
    types: [labeled]

concurrency:
  group: ai-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    # Only run when someone adds the `ai-review` label.
    if: github.event.label.name == 'ai-review'
    permissions:
      contents: read
      pull-requests: write
    uses: jocelinho/pr-review-plugin/.github/workflows/review.yml@main
    # Optional: override the coordinator model (default: claude-sonnet-5-5).
    # with:
    #   model: claude-opus-5-5
    # Pass only the secret the review needs — `secrets: inherit` would hand
    # every secret in this repo to a workflow that lives in another repo.
    secrets:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      # Optional: a PAT that can read cardinalblue/skills turns on the TCA checks.
      SKILLS_REPO_TOKEN: ${{ secrets.SKILLS_REPO_TOKEN }}
