name: pr-review

# Reusable workflow: called from each target repo's thin entry workflow.
# The `github` context here belongs to the CALLER (e.g. DayFrame-iOS), not this repo.
on:
  workflow_call:
    inputs:
      model:
        description: Model for the coordinator session (each reviewer agent sets its own in its frontmatter)
        type: string
        required: false
        default: claude-sonnet-5-5
    secrets:
      ANTHROPIC_API_KEY:
        required: true
      SKILLS_REPO_TOKEN:
        description: Optional PAT that can read cardinalblue/skills; enables the TCA checks
        required: false

jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    permissions:
      contents: read
      pull-requests: write

    # `secrets` can't be referenced in a step's `if:`, so expose only whether it is set.
    env:
      HAS_SKILLS_TOKEN: ${{ secrets.SKILLS_REPO_TOKEN != '' }}

    steps:
      # A. The code under review: the caller repo, at this PR's head.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # B. The reviewer: this plugin repo, cloned into a subfolder.
      #    The repo is public, so no token is needed. If it goes private, add `token:`
      #    with a PAT that can read it — GITHUB_TOKEN only reaches the caller repo.
      - uses: actions/checkout@v4
        with:
          repository: jocelinho/pr-review-plugin
          ref: main
          path: .review-plugin

      # Optional: the company's private TCA skill. Skipped without a token, and a token
      # without access fails this step without failing the job. The framework reviewer
      # uses the TCA skill only if
      # .company-skills/plugins/ios/skills/tca-composable-architecture/SKILL.md exists.
      - uses: actions/checkout@v4
        if: env.HAS_SKILLS_TOKEN == 'true'
        continue-on-error: true
        with:
          repository: cardinalblue/skills
          path: .company-skills
          token: ${{ secrets.SKILLS_REPO_TOKEN }}
          sparse-checkout: plugins/ios/skills/tca-composable-architecture

      # C. Headless Claude Code, with the plugin loaded from the folder above.
      - uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          prompt: /pr-review:review-pr ${{ github.event.pull_request.number }}
          claude_args: |
            --plugin-dir .review-plugin/plugins/pr-review
            --model ${{ inputs.model }}
            --max-turns 40
            --allowedTools "Agent,Read,Grep,Glob,Write,Bash(gh pr view:*),Bash(gh pr diff:*),Bash(gh pr comment:*)"
